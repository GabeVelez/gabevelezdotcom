<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Half-a-Buck — Mission: Brooklyn</title>

    <!-- Retro arcade fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="game"></div>

    <!-- Game UI Overlay -->
    <div id="game-ui">
      <!-- Bottom left: Detection meter -->
      <div id="detection-container">
        <div id="detection-label">DETECTION:</div>
        <div id="detection-meter-bg">
          <div id="detection-meter-fill"></div>
        </div>
      </div>

      <!-- Bottom right: Controls -->
      <div id="controls-container">
        <div id="help-text">Press H for help</div>
        <button id="sound-toggle" aria-label="Toggle sound">
          <span id="sound-icon">🔊</span>
        </button>
      </div>

      <!-- Help overlay (toggled with H key) -->
      <div id="help-overlay" style="display: none;">
        <div id="help-content">
          <h3>Controls</h3>
          <p><strong>WASD / Arrow Keys</strong> - Move</p>
          <p><strong>Goal</strong> - Avoid guard vision cones</p>
          <p><strong>Detection meter fills = GAME OVER</strong></p>
          <hr>
          <p class="help-debug"><strong>V</strong> - Vision debug</p>
          <p class="help-debug"><strong>C</strong> - Collision debug</p>
          <p class="help-debug"><strong>B</strong> - Body debug</p>
          <p class="help-close">Press <strong>H</strong> to close</p>
        </div>
      </div>
    </div>

    <!-- Landscape-only overlay -->
    <div id="rotate-overlay" aria-hidden="true">
      <div class="rotate-card">
        <div class="rotate-title">Rotate to Play</div>
        <div class="rotate-sub">Half-a-Buck is landscape-only.</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
